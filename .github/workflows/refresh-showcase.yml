name: Refresh public .agent showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public directory snapshot
        run: node scripts/update-showcase.mjs
      - name: Validate static release
        run: npm run check
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/slds.json; then
            echo "No showcase changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slds.json
          git commit -m "chore: refresh public agent showcase"
          git push
